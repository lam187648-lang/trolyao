<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>UI check</title>
<style>
  body { margin: 0; background: #0b1220; }
  iframe { border: 0; display: block; background: #fff; }
</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search);
  var w = q.get('w') || '390';
  var h = q.get('h') || '844';
  var p = q.get('p') || 'index.html';
  var f = document.createElement('iframe');
  f.width = w;
  f.height = h;
  f.src = p;
  document.body.appendChild(f);
</script>
</body>
</html>
