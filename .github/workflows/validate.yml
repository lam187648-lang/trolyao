name: Validate project

on:
  push:
    branches: [master, futuristic-overhaul-final]
  pull_request:
    branches: [master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check active JavaScript syntax
        run: |
          node --check server.js
          node --check app.js
          node --check auth.js
          node --check auth-api.js
          node --check login.js
          node --check register.js
          node --check mobile-compatible-auth.js
          node --check theme-manager.js
          node --check theme-settings.js
          node --check games.js
          node --check page-navigation.js
          node --check head-tracking-game.js
          node --check server/server.js
          node --check server/database.js
          node --check server/auth-middleware.js
          node --check server/auth-routes.js
          node --check server/admin-routes.js
          node --check server/token-routes.js
          node --check server/theme-catalog.js
          node --check server/garden-routes.js
          node --check server/legacy-import-routes.js
          node --check server/tests/helpers.js
          node --check legacy-import.js
          node --check server/scripts/migrate.js
          node --check server/scripts/promote-admin.js
          node --check token-shop-new.js
          node --check token-shop.js
          node --check token-page.js
          node --check admin-simple.js
          node --check admin-panel.js
          node --check path-manager.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('path-config.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('server/package.json', 'utf8'))"
